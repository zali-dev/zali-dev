<svg width="1280" height="640" viewBox="0 0 1280 640" fill="none" xmlns="http://www.w3.org/2000/svg">

<defs>

<linearGradient id="bg" x1="0" y1="0" x2="1280" y2="640">
<stop offset="0%" stop-color="#090B14"/>
<stop offset="100%" stop-color="#121826"/>
</linearGradient>

<radialGradient id="glow1">
<stop offset="0%" stop-color="#7C3AED" stop-opacity=".45"/>
<stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
</radialGradient>

<radialGradient id="glow2">
<stop offset="0%" stop-color="#A855F7" stop-opacity=".25"/>
<stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
</radialGradient>

<filter id="shadow">
<feGaussianBlur stdDeviation="30"/>
</filter>

<style>
.title{
font:700 78px 'JetBrains Mono','Consolas',monospace;
fill:#F8FAFC;
letter-spacing:6px;
}

.subtitle{
font:600 32px 'Inter','Segoe UI',sans-serif;
fill:#A78BFA;
}

.body{
font:500 22px 'Inter','Segoe UI',sans-serif;
fill:#CBD5E1;
}

.small{
font:500 18px 'Inter','Segoe UI',sans-serif;
fill:#94A3B8;
}

.line{
stroke:#7C3AED;
stroke-width:2;
opacity:.25;
}

.grid{
stroke:#313244;
stroke-width:1;
opacity:.25;
}

.tag{
fill:#171E2D;
stroke:#7C3AED;
stroke-opacity:.35;
rx:16;
}

.tagtext{
font:600 18px 'Inter';
fill:#E2E8F0;
}

</style>

</defs>

<rect width="1280" height="640" fill="url(#bg)"/>

<circle cx="1040" cy="130" r="220" fill="url(#glow1)" filter="url(#shadow)"/>

<circle cx="150" cy="520" r="180" fill="url(#glow2)" filter="url(#shadow)"/>

<!-- Grid -->

<g>

<line x1="90" y1="80" x2="90" y2="560" class="grid"/>

<line x1="180" y1="80" x2="180" y2="560" class="grid"/>

<line x1="270" y1="80" x2="270" y2="560" class="grid"/>

<line x1="90" y1="160" x2="470" y2="160" class="grid"/>

<line x1="90" y1="260" x2="470" y2="260" class="grid"/>

<line x1="90" y1="360" x2="470" y2="360" class="grid"/>

<line x1="90" y1="460" x2="470" y2="460" class="grid"/>

</g>

<!-- Decorative -->

<line x1="820" y1="120" x2="1180" y2="120" class="line"/>

<line x1="900" y1="160" x2="1180" y2="160" class="line"/>

<line x1="980" y1="200" x2="1180" y2="200" class="line"/>

<!-- Main -->

<text x="90" y="185" class="title">ZALINA</text>

<text x="95" y="245" class="subtitle">Backend Developer</text>

<text x="95" y="305" class="body">
Python • Django • PostgreSQL • Docker
</text>

<text x="95" y="345" class="body">
Linux • REST API • DevOps
</text>

<text x="95" y="430" class="small">
Building reliable backend applications.
</text>

<!-- Tags -->

<rect x="90" y="495" width="118" height="42" class="tag"/>
<text x="122" y="522" class="tagtext">Python</text>

<rect x="225" y="495" width="118" height="42" class="tag"/>
<text x="258" y="522" class="tagtext">Django</text>

<rect x="360" y="495" width="150" height="42" class="tag"/>
<text x="382" y="522" class="tagtext">PostgreSQL</text>

<rect x="530" y="495" width="118" height="42" class="tag"/>
<text x="563" y="522" class="tagtext">Docker</text>

<rect x="665" y="495" width="110" height="42" class="tag"/>
<text x="700" y="522" class="tagtext">Linux</text>

</svg>
